name: Match

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [usa]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: command -v ninja > /dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - run: python -m pip install -r tools/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            tools/mwccarm
            dsd
            objdiff-cli
            wibo
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/download_tool.py', 'tools/configure.py') }}

      - name: Fetch baserom and BIOS
        env:
          GH_TOKEN: ${{ secrets.BASEROM_TOKEN }}
          BASEROM_REPO: ${{ secrets.BASEROM_REPO }}
          BASEROM_TAG: ${{ vars.BASEROM_TAG }}
        run: |
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'baserom_dqix_${{ matrix.version }}.nds' -D extract/
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'arm7_bios.bin' -D .

      - run: sha1sum -c ci/baseroms_${{ matrix.version }}.sha1

      - run: python tools/configure.py ${{ matrix.version }}

      - run: ninja

      - run: ninja report

      - name: Progress summary
        run: |
          {
            echo '### Progress (${{ matrix.version }})'
            echo '```'
            python tools/report_badges.py build/${{ matrix.version }}/report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/report_badges.py build/${{ matrix.version }}/report.json -o badges/${{ matrix.version }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: badges-${{ matrix.version }}
          path: badges/

  badges:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: badges-*
          merge-multiple: true
          path: badges

      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges publish
          cd publish
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          fi
          cp -r ../badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update progress badges for ${{ github.sha }}"
          git push -q origin badges

  match:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ needs.build.result }}" in
            success|skipped) ;;
            *) echo "build: ${{ needs.build.result }}"; exit 1 ;;
          esac
