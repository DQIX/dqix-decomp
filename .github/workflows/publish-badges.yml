name: Publish badges

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: badges-${{ inputs.version }}
          path: badges

      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges publish
          cd publish
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          fi
          cp -r ../badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update ${{ inputs.version }} progress badges for ${{ github.sha }}"
          git push -q origin badges
