name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      label:
        required: true
        type: string
      publish-badges:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: command -v ninja > /dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - run: python -m pip install -r tools/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            tools/mwccarm
            dsd
            objdiff-cli
            wibo
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/download_tool.py', 'tools/configure.py') }}

      - run: python tools/configure.py ${{ inputs.version }}

      - name: Compile shard
        run: |
          ninja -t targets rule mwcc | sort | awk 'NR % ${{ strategy.job-total }} == ${{ matrix.shard }}' > objects.txt
          xargs -r -a objects.txt ninja
          mv .ninja_log .ninja_log.${{ matrix.shard }}
          sed 's/\.o$/.d/' objects.txt | cat objects.txt - | tar -cf objects-${{ matrix.shard }}.tar -T - .ninja_log.${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        with:
          name: objects-${{ inputs.version }}-${{ matrix.shard }}
          path: objects-${{ matrix.shard }}.tar
          retention-days: 1

  build:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: command -v ninja > /dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - run: python -m pip install -r tools/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            tools/mwccarm
            dsd
            objdiff-cli
            wibo
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/download_tool.py', 'tools/configure.py') }}

      - name: Fetch baserom and BIOS
        env:
          GH_TOKEN: ${{ secrets.BASEROM_TOKEN }}
          BASEROM_REPO: ${{ secrets.BASEROM_REPO }}
          BASEROM_TAG: ${{ vars.BASEROM_TAG }}
        run: |
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'baserom_dqix_${{ inputs.version }}.nds' -D extract/
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'arm7_bios.bin' -D .

      - run: sha1sum -c ci/baseroms_${{ inputs.version }}.sha1

      - run: python tools/configure.py ${{ inputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: objects-${{ inputs.version }}-*
          path: objects
          merge-multiple: true

      - name: Date sources and compiler before the compiled objects
        run: |
          git ls-files -z | xargs -0 touch -h -d @946684800
          for tool in tools/mwccarm wibo; do
            [ ! -e "$tool" ] || find "$tool" -exec touch -h -d @946684800 {} +
          done

      - name: Unpack compiled objects
        run: |
          for archive in objects/*.tar; do tar -xf "$archive"; done
          cat .ninja_log.* | awk 'NR == 1 || !/^#/' > .ninja_log

      - run: ninja

      - name: Progress summary
        run: |
          {
            echo '### Progress (${{ inputs.label }})'
            echo '```'
            python tools/report_badges.py build/${{ inputs.version }}/report.json -l '${{ inputs.label }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate badge data
        if: inputs.publish-badges
        run: python tools/report_badges.py build/${{ inputs.version }}/report.json -l '${{ inputs.label }}' -o badges/${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        if: inputs.publish-badges
        with:
          name: badges-${{ inputs.version }}
          path: badges/
